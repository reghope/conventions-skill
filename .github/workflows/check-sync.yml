name: Check skill mirrors
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the mirrors match the canonical skills
        run: |
          rm -rf /tmp/flat && mkdir -p /tmp/flat
          for skill in skills/*/*/; do cp -r "$skill" "/tmp/flat/$(basename "$skill")"; done
          diff -r /tmp/flat .claude/skills
          diff -r /tmp/flat .github/skills
